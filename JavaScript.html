<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <p id="text1">Toto je puvodni text</p>
    <button onclick="zmenBarvu()">Zmen barvu</button>
    <button onclick="zmenText()">Zmen text</button>
    <button onclick="odstranNeboZobrazText()">Odstran nebo zobraz text</button>

</body>

<script>

    function zmenBarvu() {
        document.getElementById("text1").style.color = "red";
    }

    function zmenText() {
        document.getElementById("text1").textContent = "Toto je novy text";
    }

    function odstranNeboZobrazText() {
        const text = document.getElementById("text1");

        if (text.style.display === "none") {
            text.style.display = "block";
        } else {
            text.style.display = "none";
        }
    }


</script>


</html>
